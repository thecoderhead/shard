name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: '.exe'
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            suffix: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compiler (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc

      - name: Package binary
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/shard${{ matrix.suffix }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "shard-${{ matrix.target }}.exe.zip" "$BIN"
          else
            tar czf "shard-${{ matrix.target }}.tar.gz" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.target }}
          path: shard-*

  build-vsix:
    name: Build VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build extension
        working-directory: extension
        run: |
          npm install --include=dev
          npm install -g @vscode/vsce
          vsce package
      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: shard-vsix
          path: extension/*.vsix

  create-release:
    needs: [build, build-vsix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum shard-* > shard-checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: shard-*
          generate_release_notes: true
          fail_on_unmatched_files: false

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
